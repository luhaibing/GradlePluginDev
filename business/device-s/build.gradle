plugins {
    id("org.jetbrains.kotlin.android")
}

if (debugModule) {
    apply plugin: "com.android.application"
    // apply plugin: "therouter"
} else {
    apply plugin: "com.android.library"
}

apply plugin: "kotlin-kapt"
apply plugin: "com.google.devtools.ksp"
apply plugin: "kotlin-parcelize"

android {
    namespace 'com.aiper.device.s'
    compileSdk 34

    defaultConfig {
        if (debugModule) {
            applicationId "com.aiper.device.s"
        }
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        dataBinding true
        viewBinding true
    }
}

dependencies {
    implementation project(path: ":base:base")
    if (debugModule) {
        implementation project(path: ":features:dev")
    }
    implementation project(":base:common-ui")
    implementation project(path: ":common-service:device-api")
    implementation project(path: ":business:device-common")
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
    implementation("cn.therouter:router:1.2.1")
    ksp("cn.therouter:apt:1.2.1")
    implementation(project(":common-service:database"))
    implementation "com.github.yyued:SVGAPlayer-Android:2.6.1"
}