plugins {
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

if (debugModule) {
    apply plugin: 'com.android.application'
} else {
    apply plugin: 'com.android.library'
}

android {
    namespace 'com.aiper.device.b'
    compileSdk 34

    defaultConfig {
        if (debugModule) {
            applicationId "com.aiper.device.b"
        }
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding true
    }
}

dependencies {
    def coroutines_version = '1.6.4'
    implementation project(path: ':base:base')
//    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation project(path: ':common-service:device-api')
    implementation project(path: ':business:device-common')
    implementation project(path: ':base:common-ui')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation("cn.therouter:router:1.2.1")
    kapt("cn.therouter:apt:1.2.1")
}


apply from: rootProject.file("gradle/publishToLocalRepo.gradle")