plugins {
    id("org.jetbrains.kotlin.android")
    id("kotlin-kapt")
}

if (debugCommonMoudle) {
    apply plugin: "com.android.application"
    apply plugin: "therouter"
} else {
    apply plugin: "com.android.library"
}
apply plugin: "kotlin-parcelize"
apply plugin: "com.google.devtools.ksp"

android {
    namespace "com.aiper.device.common"
    compileSdk 34

    defaultConfig {
        if (debugCommonMoudle) {
            applicationId "com.aiper.device.common"
        }
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "1.2.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += ["-Xcontext-receivers"]
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        aidl true
    }
}

dependencies {
    implementation project(path: ":base:base")
    implementation project(":base:common-ui")
    implementation project(path: ":common-service:device-api")
    if (debugCommonMoudle) {
        implementation project(":features:dev")
    }
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.8.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.activity:activity:1.8.0")

    implementation("com.google.protobuf:protobuf-java:3.24.4")
    implementation("androidx.datastore:datastore:1.0.0")
    implementation("androidx.datastore:datastore-preferences:1.0.0")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.7.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
    implementation("androidx.navigation:navigation-fragment-ktx:2.6.0")
    implementation("androidx.navigation:navigation-ui-ktx:2.6.0")
    implementation project(":business:sobot-chat")

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    implementation(project(":common-service:database"))

    implementation("cn.therouter:router:1.2.1")
    kapt("cn.therouter:apt:1.2.1")

    // https://mvnrepository.com/artifact/com.github.javafaker/javafaker
    implementation("com.github.javafaker:javafaker:1.0.2")
    api("com.github.weidongjian:androidWheelView:1.0.0")

    api("com.github.DylanCaiCoding.DataStoreKTX:datastore-ktx:1.0.0")

    ksp "cn.therouter:apt:1.1.4"
    // https://mvnrepository.com/artifact/androidx.palette/palette
    implementation("androidx.palette:palette:1.0.0")

    /*
    implementation("com.github.luhaibing.chestnuts:core:1.2")
    ksp("com.github.luhaibing.chestnuts:processor:1.2")
    */
    implementation(libs.chestnuts.core)
    ksp(libs.chestnuts.processor)
    implementation(project(":features:ymodem"))
}