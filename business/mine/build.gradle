plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
}

android {
    namespace 'com.aiper.sobot'
    compileSdk 34

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
    // api("com.sobot.chat:sobotsdk_x:4.1.2")
    // api("com.sobot.chat:sobotsdk_x:4.1.4.1")
    implementation project(':base:base')
    implementation project(':base:common-ui')
    implementation project(':common-service:device-api')
    implementation(project(":common-service:database"))
    // api(project(":features:sobotsdk-x"))

    implementation("cn.therouter:router:1.2.1")
    kapt("cn.therouter:apt:1.2.1")
    // implementation("cn.therouter:apt:1.2.1")
}