plugins {
    id 'org.jetbrains.kotlin.android'
}

if (debugModule) {
    apply plugin: 'com.android.application'
    apply plugin: 'therouter'
} else {
    apply plugin: 'com.android.library'
}

apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'

android {
    namespace 'com.aiper.device.i'
    compileSdk 34

    defaultConfig {
        minSdk 26

        if (debugModule) {
            applicationId "com.aiper.device.i"
            minSdk 26
            targetSdk 34
            versionCode 38
            versionName "2.1.0"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        // 使用 com.aiper.base.widget.MessageDialog 必现配置该属性
        dataBinding true
    }
}

dependencies {
    /*
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    */

    /*
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation "cn.therouter:router:1.1.4"
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    */

    testImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test.ext:junit:1.2.1')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.6.1')

    implementation project(path: ':base:base')
    if (debugModule) {
        implementation project(path: ':features:dev')
    }
    implementation project(':base:common-ui')
    implementation project(path: ':common-service:device-api')
    implementation project(path: ':business:device-common')
    implementation("cn.therouter:router:1.2.1")
    ksp("cn.therouter:apt:1.2.1")
    implementation(project(":common-service:database"))
    implementation 'com.github.yyued:SVGAPlayer-Android:2.6.1'

    // https://mvnrepository.com/artifact/com.github.javafaker/javafaker
    implementation("com.github.javafaker:javafaker:1.0.2")
    // implementation project(path: ':features:weather')

    implementation("androidx.paging:paging-common-ktx:3.3.4")
    implementation("androidx.paging:paging-runtime-ktx:3.3.4")

    /*
    implementation("com.github.luhaibing.chestnuts:core:1.2")
    ksp("com.github.luhaibing.chestnuts:processor:1.2")
    */
    implementation(libs.chestnuts.core)
    ksp(libs.chestnuts.processor)
    implementation(project(":features:ymodem"))
    implementation("androidx.media3:media3-exoplayer:1.3.1")
    implementation("androidx.media3:media3-ui:1.3.1")
}