// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    dependencies {
        classpath 'com.sensorsdata.analytics.android:android-gradle-plugin2:3.5.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
    }
    def dir = new File(rootDir, "plugin-resp")
    if (dir.exists()) {
        repositories {
            maven {
                url dir.toURI()
            }
        }
        dependencies {
            classpath("com.mercer:magician:1.0.0")
        }
    }
}

plugins {
    id 'com.android.application' version '7.4.2' apply false
    id 'com.android.library' version '7.4.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
    id 'cn.therouter' version '1.2.0' apply false
    id 'com.google.gms.google-services' version "4.4.2" apply false
    id 'com.google.devtools.ksp' version "1.9.0-1.0.13" apply false
    id 'org.jetbrains.kotlin.jvm' version "1.9.0" apply false
    // id("dependency-reuse") apply(true)
}
// 根据此文件判定当前是否在开发人员本地
def localFile = rootProject.file("local.properties")
ext {
    debugCommonMoudle = false
    debugModule = false
    isLocal = localFile.exists()
}

task clean(type: Delete) {
    delete rootProject.buildDir
    delete(new File(rootDir, "local-repo"))
    delete(new File(rootDir, "repo"))
    delete(new File(rootDir, "resp"))
}

def dir = new File(rootDir, "plugin-resp")
if (dir.exists()) {
    apply plugin: "dependency-reuse"
    Properties localProperties = getLocalProperties()
    def isEnabled = Boolean.parseBoolean(localProperties.get("use.dependency.reuse"))
    dependencyReuse {
        respUri = new File(rootDir, "resp").toURI()
        groupId = "com.mercer"
        enabled = true
        autoPublish = true
    }
}

Properties getLocalProperties() {
    def properties = new Properties()
    def file = new File(rootDir, "local.properties")
    println(file.absolutePath)
    properties.load(file.newInputStream())
    return properties
}