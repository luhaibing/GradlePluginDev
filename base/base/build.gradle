    def room_version = "2.4.2"
    kapt "androidx.room:room-compiler:$room_version"
    def luck_version = "v3.11.1"
    api "io.github.lucksiege:pictureselector:$luck_version"
    api "io.github.lucksiege:compress:$luck_version"
    api "io.github.lucksiege:ucrop:$luck_version"
    api 'com.amazonaws:aws-android-sdk-s3:2.73.0'// 亚马逊文件上传库
    api 'com.airbnb.android:lottie:6.4.0'
