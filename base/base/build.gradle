protobuf {
    protoc {
        // artifact = "com.google.protobuf:protoc:3.19.4"
        // artifact = "com.google.protobuf:protoc:3.25.3"
        artifact = "com.google.protobuf:protoc:3.24.4"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}