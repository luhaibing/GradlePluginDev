    api "androidx.camera:camera-view:1.2.2"
    api 'com.google.mlkit:barcode-scanning:17.2.0'
    api 'no.nordicsemi.android:ble-ktx:2.9.0'
    api 'no.nordicsemi.android.support.v18:scanner:1.6.0'
