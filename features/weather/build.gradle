plugins {
    id("com.android.library")
    id("org.jetbrains.kotlin.android")
    id("com.google.devtools.ksp")
    id "kotlin-kapt"
}

apply plugin: "kotlin-parcelize"

android {
    namespace "com.aiper.weather"
    compileSdk 34

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.10.1")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.10.0")

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"

    ksp("cn.therouter:apt:1.2.1")

    implementation(project(":base:base"))
    implementation(project(":base:common-ui"))

    //datastore
    implementation("androidx.datastore:datastore:1.0.0")
    implementation("androidx.datastore:datastore-preferences:1.0.0")

    // google 定位服务
    implementation("com.google.android.gms:play-services-location:21.3.0")

    /*
    implementation("com.github.luhaibing.chestnuts:core:1.2")
    ksp("com.github.luhaibing.chestnuts:processor:1.2")
    */
    implementation(libs.chestnuts.core)
    ksp(libs.chestnuts.processor)

}